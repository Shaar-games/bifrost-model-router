name: Release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3
      - name: Test exact tag
        run: nix flake check --no-update-lock-file --print-build-logs
      - name: Export closure and compatibility metadata
        run: |
          nix build .#default --out-link result
          mkdir -p dist
          nix copy --to file://"$PWD/dist/nix-store" .#default
          nix path-info --json --closure .#default >dist/closure.json
          cp flake.lock config/router.schema.json dist/
          tar -C dist -czf bifrost-model-router-${GITHUB_REF_NAME}.tar.gz .
          sha256sum bifrost-model-router-${GITHUB_REF_NAME}.tar.gz >checksums.txt
      - name: Upload reproducible release closure
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bifrost-model-router-${{ github.ref_name }}
          path: |
            bifrost-model-router-*.tar.gz
            checksums.txt
          if-no-files-found: error
